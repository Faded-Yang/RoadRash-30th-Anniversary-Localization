name: publish release

on:
  push:
    paths:
      - '.github/workflows/release.yml'
      - 'installer/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build installer
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          python -m pip install --quiet pefile
          python installer/build_installer.py
          if (-not (Test-Path "dist/RoadRash-Localization-zh-CN.exe")) { throw "build produced no exe" }

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = "dist/RoadRash-Localization-zh-CN.exe"
          gh release view v1.3.0 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.3.0 $exe --title "v1.3.0 - 简体中文" --notes-file docs/RELEASE-v1.3.0.md --latest
          } else {
            gh release upload v1.3.0 $exe --clobber
          }
